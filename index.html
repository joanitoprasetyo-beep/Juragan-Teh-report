<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juragan Teh Nusantara - POS & Rekap 6 Outlet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Dynamic Favicon (Locked via JS on load) -->
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="">

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --emerald-deep: #03221a;
            --emerald-dark: #06372a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--emerald-deep);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================================================
           PATENTED 1-COLOR GOLD LOGO PATTERN BACKGROUND (LOCKED & FIXED)
           ========================================================================== */
        #patented-gold-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-color: #03221a;
            background-image:
                radial-gradient(circle at 18% 15%, rgba(212, 175, 55, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 85% 82%, rgba(16, 185, 129, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(4, 47, 36, 0.4) 0%, rgba(2, 24, 18, 0.92) 100%);
        }

        #patented-gold-pattern-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background-repeat: repeat;
            background-size: 165px 165px;
            background-position: center center;
            opacity: 0.16;
        }

        .gold-watermark-card {
            position: relative;
            overflow: hidden;
        }
        .gold-watermark-card::after {
            content: "";
            position: absolute;
            right: -28px;
            bottom: -28px;
            width: 150px;
            height: 150px;
            background-image: var(--gold-logo-url);
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================================================
           LOCKED GLASSMORPHISM & GOLD BORDERS
           ========================================================================== */
        .glass-header {
            background: rgba(3, 34, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.38);
        }

        .glass-panel {
            background: rgba(6, 52, 39, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.32);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(4, 39, 29, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.26);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(212, 175, 55, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.18);
        }

        .glass-input {
            background: rgba(2, 22, 17, 0.78);
            border: 1px solid rgba(212, 175, 55, 0.42);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
            background: rgba(2, 22, 17, 0.95);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa820a 100%);
            color: #03221a;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            transition: all 0.2s ease;
        }

        .btn-gold:hover {
            filter: brightness(1.07);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-gold:active {
            transform: translateY(0);
        }

        .btn-emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(167, 243, 208, 0.3);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }

        .btn-emerald:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(3, 34, 26, 0.6); }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 9999px; }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-refresh {
            animation: spinSlow 0.65s ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.22s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(82%) sepia(47%) saturate(568%) hue-rotate(358deg) brightness(97%) contrast(92%);
            cursor: pointer;
        }
    </style>
</head>
<body class="antialiased selection:bg-amber-400 selection:text-emerald-950">

    <script type="module">

                    <path d="M 255,202 C 252,182 268,175 288,188 L 280,206" fill="none" stroke="${c.apronFill}" stroke-width="5" stroke-linecap="round"/>

                    <path d="M 320,152 C 327,152 328,165 319,168" fill="${c.skinFill}" stroke="${c.skinStroke}" stroke-width="2.5"/>

                    <path d="M 305,275 L 252,328 L 228,332" fill="none" stroke="${c.skinFill}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 305,275 L 252,328 L 228,332" fill="none" stroke="${c.skinStroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="226" cy="332" r="11" fill="${c.skinFill}" stroke="${c.skinStroke}" stroke-width="2.8"/>

                    <g transform="translate(192, 355)">
                        <path d="M -24,-12 L -38,-22 L -32,8 L -22,12 Z" fill="${c.metalFill}" stroke="${c.metalStroke}" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M -24,-20 L 22,-20 L 26,30 C 26,35 -28,35 -28,30 Z" fill="${c.metalFill}" stroke="${c.metalStroke}" stroke-width="3" stroke-linejoin="round"/>
                        <ellipse cx="-1" cy="-20" rx="23" ry="5" fill="${c.metalFill}" stroke="${c.metalStroke}" stroke-width="3"/>

            return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
        }

        const LOGO_COLOR_URI = createJuraganLogoSVG(false);
        const LOGO_GOLD_URI = createJuraganLogoSVG(true);

        document.getElementById('app-favicon').href = LOGO_COLOR_URI;
        const patternLayer = document.getElementById('patented-gold-pattern-layer');
        if (patternLayer) {
            patternLayer.style.backgroundImage = `url("${LOGO_GOLD_URI}")`;
        }
        document.documentElement.style.setProperty('--gold-logo-url', `url("${LOGO_GOLD_URI}")`);

        // =========================================================================
        // 2. PATENTED CONSTANTS: 6 OFFICIAL OUTLETS, OWNER PIN & DEFAULT MENU
        // =========================================================================
        const OWNER_PIN = '281001';

        const OUTLETS = [
            { id: 'outlet_1', number: 1, label: '1. Juragan Ngaliyan', shortName: 'Juragan Ngaliyan', area: 'Kec. Ngaliyan, Semarang', icon: 'fa-store', pin: '1221' },
            { id: 'outlet_2', number: 2, label: '2. Juragan Sampangan', shortName: 'Juragan Sampangan', area: 'Kec. Gajahmungkur, Semarang', icon: 'fa-shop', pin: '1331' },
            { id: 'outlet_3', number: 3, label: '3. Juragan Banyumanik', shortName: 'Juragan Banyumanik', area: 'Kec. Banyumanik, Semarang', icon: 'fa-mug-hot', pin: '1441' },
            { id: 'outlet_4', number: 4, label: '4. Juragan Mijen', shortName: 'Juragan Mijen', area: 'Kec. Mijen, Semarang', icon: 'fa-mug-saucer', pin: '1551' },
            { id: 'outlet_5', number: 5, label: '5. Juragan Baru 1', shortName: 'Juragan Baru 1', area: 'Cabang Ekspansi Baru 1', icon: 'fa-building-flag', pin: '1661' },
            { id: 'outlet_6', number: 6, label: '6. Juragan Baru 2', shortName: 'Juragan Baru 2', area: 'Cabang Ekspansi Baru 2', icon: 'fa-flag', pin: '1771' }
        ];

        const DEFAULT_PRODUCTS = [
            { id: 'prod_1', name: 'Es Teh Nusantara Original', price: 3000, category: 'Original' },
            { id: 'prod_2', name: 'Es Teh Jumbo Kampul', price: 4000, category: 'Original' },
            { id: 'prod_3', name: 'Es Teh Tarik Nusantara', price: 6000, category: 'Creamy' },
            { id: 'prod_4', name: 'Es Lemon Tea Segar', price: 5000, category: 'Fruity' },
            { id: 'prod_5', name: 'Es Lychee Tea Premium', price: 6000, category: 'Fruity' },
            { id: 'prod_6', name: 'Es Matcha Green Tea', price: 8000, category: 'Creamy' },
            { id: 'prod_7', name: 'Es Thai Tea Juragan', price: 7000, category: 'Creamy' },
            { id: 'prod_8', name: 'Teh Krampul Hangat', price: 3500, category: 'Hangat' }
        ];

        const STORAGE_KEYS = {
            PRODUCTS: 'jt_nusantara_products_v3',
            SALES: 'jt_nusantara_sales_v3',
            RECAPS: 'jt_nusantara_recaps_v3',
            SESSION: 'jt_nusantara_session_v3',
            LAST_SAVED: 'jt_nusantara_last_saved_v3'
        };

        // =========================================================================
        // 3. DATE & CURRENCY FORMATTERS
        // =========================================================================
        function getTodayStr() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now.getTime() - offset).toISOString().split('T')[0];
        }

        function getYesterdayStr() {
            const now = new Date(Date.now() - 86400000);
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now.getTime() - offset).toISOString().split('T')[0];
        }

        function getCurrentMonthStr() {
            return getTodayStr().slice(0, 7);
        }

        function formatRupiah(num) {
            return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
        }

        function formatFullDateID(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            return d.toLocaleDateString('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function formatMonthID(monthStr) {
            if (!monthStr) return '-';
            const parts = monthStr.split('-');
            if (parts.length !== 2) return monthStr;
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
            return d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
        }

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // =========================================================================
        // 4. STATE & PERSISTENT LOCAL STORAGE (SURVIVES REFRESH)
        // =========================================================================
        function loadSavedSession() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.SESSION);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        role: parsed.role || null,
                        activeOutletId: parsed.activeOutletId || 'outlet_1',
                        showOutletSelector: parsed.role === 'worker' ? Boolean(parsed.showOutletSelector) : false,
                        ownerTab: parsed.ownerTab || 'rekap_outlet',
                        detailOutletId: parsed.detailOutletId || 'outlet_1',
                        detailDate: parsed.detailDate || getTodayStr(),
                        inputDate: parsed.inputDate || getTodayStr(),
                        reportDate: parsed.reportDate || getTodayStr(),
                        reportMonth: parsed.reportMonth || getCurrentMonthStr(),
                        reportFilterMode: parsed.reportFilterMode || 'date'
                    };
                }
            } catch (e) {
                console.warn('Session restore fallback:', e);
            }
            return {
                role: null,
                activeOutletId: 'outlet_1',
                showOutletSelector: false,
                ownerTab: 'rekap_outlet',
                detailOutletId: 'outlet_1',
                detailDate: getTodayStr(),
                inputDate: getTodayStr(),
                reportDate: getTodayStr(),
                reportMonth: getCurrentMonthStr(),
                reportFilterMode: 'date'
            };
        }

        function loadSavedProducts() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {
                console.warn('Failed reading products:', e);
            }
            return [...DEFAULT_PRODUCTS];
        }

        function loadSavedSales() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.SALES);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed.map(item =>
                            item.outletId === 'outlet_4'

        // =========================================================================
        // 5. FIREBASE REAL-TIME CLOUD SYNC (AUTO-SYNC + OFFLINE FALLBACK)
        // =========================================================================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'juragan-teh-nusantara-pos';
        let db = null;
        let auth = null;
        let currentUser = null;
        let unsubProducts = null;
        let unsubSales = null;
        let unsubRecaps = null;

        async function initFirebaseCloud() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    state.cloudConnected = false;
                    render();
                    return;
                }
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        state.cloudConnected = true;
                        startRealtimeListeners();
                    } else {
                        state.cloudConnected = false;
                    }
                    render();
                });
            } catch (err) {
                console.warn('Cloud offline mode active:', err);
                state.cloudConnected = false;
                render();
            }
        }

        function startRealtimeListeners() {
            if (!db || !currentUser) return;

            if (unsubProducts) unsubProducts();
            if (unsubSales) unsubSales();
            if (unsubRecaps) unsubRecaps();

            const prodCol = collection(db, 'artifacts', appId, 'public', 'data', 'jt_products');
            const salesCol = collection(db, 'artifacts', appId, 'public', 'data', 'jt_sales');
            const recapsCol = collection(db, 'artifacts', appId, 'public', 'data', 'jt_recaps');

            unsubProducts = onSnapshot(prodCol, async (snap) => {
                if (snap.empty && state.products.length > 0) {
                    for (const p of state.products) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jt_products', p.id), p);
                    }
                    return;
                }
                if (!snap.empty) {
                    const cloudProds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    cloudProds.sort((a, b) => a.name.localeCompare(b.name));
                    state.products = cloudProds;
                    saveLocalData();
                    render();
                }
            }, (err) => {
                console.warn('Products snapshot warning:', err);
            });

            unsubSales = onSnapshot(salesCol, (snap) => {
                const cloudSales = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const mergedMap = new Map();
                state.sales.forEach(s => mergedMap.set(s.id, s));
                cloudSales.forEach(s => mergedMap.set(s.id, s));
                state.sales = Array.from(mergedMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                saveLocalData();
                render();
            }, (err) => {
                console.warn('Sales snapshot warning:', err);
            });

            unsubRecaps = onSnapshot(recapsCol, (snap) => {
                const cloudRecaps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const mergedMap = new Map();
                state.recaps.forEach(r => mergedMap.set(r.id, r));
                cloudRecaps.forEach(r => mergedMap.set(r.id, r));
                state.recaps = Array.from(mergedMap.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                saveLocalData();
                render();
            }, (err) => {
                console.warn('Recaps snapshot warning:', err);
            });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const colors = {
                success: 'bg-emerald-950/95 border-emerald-400 text-emerald-100',
                error: 'bg-red-950/95 border-red-400 text-red-100',
                info: 'bg-amber-950/95 border-[#d4af37] text-amber-100'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-exclamation text-red-400',
                info: 'fa-database text-[#d4af37]'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-2xl backdrop-blur-md text-xs font-semibold fade-in ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info} text-base shrink-0"></i>
                <span class="flex-1 leading-snug">${escapeHTML(message)}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-6px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 260);
            }, 3400);

        window.submitDailyRecapToDatabase = function(e, outletId, dateStr) {
            e.preventDefault();
            const outlet = OUTLETS.find(o => o.id === outletId) || OUTLETS[0];
            const confirmedUnits = parseInt(document.getElementById('recap-units-input')?.value || '0', 10);
            const confirmedRevenue = parseInt(document.getElementById('recap-rev-input')?.value || '0', 10);
            const actualCash = parseInt(document.getElementById('recap-cash-input')?.value || '0', 10);
            const note = (document.getElementById('recap-note-input')?.value || '').trim();

            const recapObj = {
                id: `recap_${outletId}_${dateStr}`,
                outletId,
                outletLabel: outlet.label,
                date: dateStr,
                month: dateStr.slice(0, 7),
                confirmedUnits: Math.max(0, confirmedUnits),
                confirmedRevenue: Math.max(0, confirmedRevenue),
                actualCash: Math.max(0, actualCash),
                note,
                confirmedBy: state.role || 'worker',
                updatedAt: Date.now()
            };

            const idx = state.recaps.findIndex(r => r.id === recapObj.id);
            if (idx >= 0) {
                state.recaps[idx] = recapObj;
            } else {
                state.recaps.unshift(recapObj);
            }

            saveLocalData();
            pushRecapToCloud(recapObj);
            window.closeModal();
            render();
            showToast(`Rekap ${outlet.label} (${recapObj.confirmedUnits} Cup • ${formatRupiah(recapObj.confirmedRevenue)}) langsung diterima di database!`, 'success');
        };

        function recordSaleTransaction(prodId, qty) {
            const prod = state.products.find(p => p.id === prodId);
            const outlet = OUTLETS.find(o => o.id === state.activeOutletId) || OUTLETS[0];
            if (!prod) return;

            const dateStr = state.inputDate || getTodayStr();
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const saleItem = {
                id: 'sale_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                outletId: outlet.id,
                outletLabel: outlet.label,
                productId: prod.id,
                productName: prod.name,
                price: Number(prod.price),
                qty: Number(qty),
                total: Number(prod.price) * Number(qty),
                date: dateStr,
                month: dateStr.slice(0, 7),
                time: timeStr,
                inputBy: state.role || 'worker',
                createdAt: Date.now()
            };

            state.sales.unshift(saleItem);
            saveLocalData();
            pushSaleToCloud(saleItem);

            showToast(`+${qty} Cup ${prod.name} (${formatRupiah(saleItem.total)}) langsung masuk database ${outlet.label}!`, 'success');
            render();
        }

            state.sales = state.sales.filter(s => s.id !== saleId);
            saveLocalData();

            showToast(`Data transaksi ${target.productName} (${target.qty} cup) dihapus dari database.`, 'info');

                        <div class="glass-panel rounded-2xl p-4 border border-[#d4af37]/35">
                            <div class="text-xs text-emerald-200">Rata-rata / Cup</div>
                            <div class="text-xl font-extrabold text-emerald-300 mt-1">${formatRupiah(avgPerCup)}</div>
                        </div>
                        <div class="glass-panel rounded-2xl p-4 border border-[#d4af37]/35">
                            <div class="text-xs text-emerald-200">Jumlah Input Kasir</div>
                            <div class="text-2xl font-extrabold text-white mt-1">${outletSales.length} <span class="text-xs text-gray-300">Kali</span></div>
                        </div>
                    </div>

                    <div class="glass-panel rounded-2xl p-5 border border-[#d4af37]/40">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                            <div>
                                <h3 class="text-sm font-extrabold text-[#f3e5ab] uppercase tracking-wider flex items-center gap-2">
                                    <i class="fas fa-table-list text-[#d4af37]"></i> Kontribusi Penjualan Menu — ${activeOutlet.label}
                                </h3>
                                <p class="text-xs text-emerald-200 mt-0.5">${formatFullDateID(targetDate)}</p>
                            </div>
                            <button onclick="window.openDailyRecapModal('${activeOutlet.id}', '${targetDate}')" class="btn-gold px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 shadow">
                                <i class="fas fa-database"></i> ${confirmedRecap ? 'Rekap DB Terkonfirmasi (' + confirmedRecap.confirmedUnits + ' Cup)' : 'Konfirmasi Rekap Harian DB'}
                            </button>
                        </div>

                        ${confirmedRecap ? `
                            <div class="mb-4 bg-emerald-950/90 border border-emerald-400/40 rounded-xl p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs">
                                <span class="font-extrabold text-emerald-300"><i class="fas fa-circle-check mr-1.5"></i>Status Rekap Harian Terkunci di Database</span>
                                <span class="text-white font-bold">Unit: ${confirmedRecap.confirmedUnits} Cup • Pendapatan: ${formatRupiah(confirmedRecap.confirmedRevenue)} • Kas Fisik: ${formatRupiah(confirmedRecap.actualCash)}</span>
                            </div>
                        ` : ''}

                        ${breakdown.length > 0 ? `
                            <div class="overflow-x-auto rounded-xl border border-[#d4af37]/25">
                                <table class="w-full text-xs">
                                    <thead class="bg-emerald-950 text-[#f3e5ab] font-extrabold uppercase">
                                        <tr>
                                            <th class="text-left py-3 px-4">Nama Produk</th>
                                            <th class="text-right py-3 px-3">Harga Satuan</th>
                                            <th class="text-center py-3 px-3">Unit Terjual</th>
                                            <th class="text-right py-3 px-3">Total Omzet</th>
                                            <th class="text-right py-3 px-4">Kontribusi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-[#d4af37]/15 bg-emerald-950/50">
                                        ${breakdown.map(row => {
                                            const pct = totalRevenue > 0 ? ((row.total / totalRevenue) * 100).toFixed(1) : '0.0';
                                            return `
                                                <tr>
                                                    <td class="py-3 px-4 font-bold text-white">${escapeHTML(row.name)}</td>
                                                    <td class="py-3 px-3 text-right text-gray-300">${formatRupiah(row.price)}</td>
                                                    <td class="py-3 px-3 text-center font-extrabold text-emerald-300">${row.qty} Cup</td>
                                                    <td class="py-3 px-3 text-right font-extrabold text-[#f3e5ab]">${formatRupiah(row.total)}</td>
                                                    <td class="py-3 px-4 text-right font-bold text-amber-200">${pct}%</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="bg-emerald-950/60 border border-dashed border-[#d4af37]/30 rounded-xl p-8 text-center text-xs text-gray-300">
                                Tidak ada data penjualan pada <strong>${activeOutlet.label}</strong> tanggal <strong>${formatFullDateID(targetDate)}</strong>.
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderOwnerHistoryTab() {
            const list = state.sales.filter(s =>
                state.historyOutletFilter === 'ALL' ? true : s.outletId === state.historyOutletFilter
            );

            return `
                <div class="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-5 fade-in">
                    <div class="glass-panel rounded-2xl p-5 border border-[#d4af37]/40">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <div>
                                <span class="text-[11px] font-extrabold uppercase tracking-widest text-[#d4af37]">Log Database Real-Time</span>
                                <h2 class="text-xl font-extrabold text-white">Seluruh Riwayat Transaksi (${list.length})</h2>
                            </div>
                            <select onchange="window.setHistoryOutletFilter(this.value)" class="glass-input rounded-xl px-3.5 py-2 text-xs font-bold text-[#f3e5ab]">
                                <option value="ALL" ${state.historyOutletFilter === 'ALL' ? 'selected' : ''}>Semua 6 Outlet</option>
                                ${OUTLETS.map(o => `<option value="${o.id}" ${state.historyOutletFilter === o.id ? 'selected' : ''}>${o.label}</option>`).join('')}
                            </select>
                        </div>

                        ${list.length > 0 ? `
                            <div class="overflow-x-auto rounded-xl border border-[#d4af37]/25">
                                <table class="w-full text-xs">
                                    <thead class="bg-emerald-950 text-[#f3e5ab] font-extrabold uppercase">
                                        <tr>
                                            <th class="text-left py-3 px-4">Tanggal & Jam</th>
                                            <th class="text-left py-3 px-3">Outlet</th>
                                            <th class="text-left py-3 px-3">Produk</th>
                                            <th class="text-center py-3 px-2">Unit</th>
                                            <th class="text-right py-3 px-3">Total</th>
                                            <th class="text-center py-3 px-3">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-[#d4af37]/15 bg-emerald-950/50">
                                        ${list.slice(0, 150).map(s => `
                                            <tr>
                                                <td class="py-2.5 px-4 text-gray-200 whitespace-nowrap">${s.date} <span class="text-emerald-300">${s.time || ''}</span></td>
                                                <td class="py-2.5 px-3 font-bold text-[#f3e5ab] whitespace-nowrap">${escapeHTML(s.outletLabel || s.outletId)}</td>
                                                <td class="py-2.5 px-3 font-semibold text-white">${escapeHTML(s.productName)}</td>
                                                <td class="py-2.5 px-2 text-center font-extrabold text-emerald-300">${s.qty}</td>
                                                <td class="py-2.5 px-3 text-right font-extrabold text-[#f3e5ab] whitespace-nowrap">${formatRupiah(s.total)}</td>
                                                <td class="py-2.5 px-3 text-center">
                                                    <button onclick="window.deleteSaleTransaction('${s.id}')" class="text-red-300 hover:text-red-200 p-1" title="Hapus Transaksi">
                                                        <i class="fas fa-trash-can"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="bg-emerald-950/60 border border-dashed border-[#d4af37]/30 rounded-xl p-8 text-center text-xs text-gray-300">
                                Belum ada riwayat transaksi yang tersimpan di database.
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // =========================================================================
        // 12. MASTER RENDER LOOP
        // =========================================================================
        function render() {
            const appEl = document.getElementById('app');
            if (!appEl) return;

            if (!state.role) {
                appEl.innerHTML = renderLoginScreen();
                return;
            }

            if (state.role === 'worker' && state.showOutletSelector) {
                appEl.innerHTML = renderWorkerOutletSelector();
                return;
            }

            let mainContent = '';
            if (state.role === 'worker') {
                mainContent = renderKasirAndProductsView();
            } else if (state.role === 'owner') {
                if (state.ownerTab === 'rekap_outlet') {
                    mainContent = renderOwnerMultiOutletDashboard();
                } else if (state.ownerTab === 'rekap_detail') {
                    mainContent = renderOwnerDetailRecapTab();
                } else if (state.ownerTab === 'kasir') {
                    mainContent = renderKasirAndProductsView();
                } else if (state.ownerTab === 'riwayat') {
                    mainContent = renderOwnerHistoryTab();
                } else {
                    mainContent = renderOwnerMultiOutletDashboard();
                }
            }

            appEl.innerHTML = `
                ${renderNavbar()}
                <main class="flex-1 pb-10">
                    ${mainContent}
                </main>
            `;
        }

        // Start App
        render();
        initFirebaseCloud();
    </script>
</body>
</html>
